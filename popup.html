<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hinglish Reader</title>
<link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="wrap">
    <header class="brand">
      <span class="leaf" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path d="M12 21c-5 0-8-3.5-8-8 0-5 4-9 11-10-.5 7-1.5 13-7 14 2.5-2 4-5 4.5-8" stroke="#2D4A3E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M12 21c3-2 5-5 5.5-9" stroke="#6FA287" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </span>
      <span>
        <h1>Hinglish Reader</h1>
        <p class="sub">Read any English page in easy Hinglish</p>
      </span>
    </header>

    <div class="progress" aria-hidden="true"><div class="progress-fill" id="progressFill"></div></div>

    <button id="go" class="primary">Translate to Hinglish</button>
    <button id="back" class="secondary">Restore original</button>
    <p id="status" class="status" role="status">Ready.</p>

    <div class="toggles">
      <label class="toggle">
        <input type="checkbox" id="adhd" checked />
        <span class="toggle-text"><strong>ADHD mode</strong><small>Highlights key lines, bolds key words</small></span>
      </label>
    </div>

    <details class="settings">
      <summary>AI settings</summary>
      <label class="field-label" for="provider">Provider</label>
      <select id="provider">
        <option value="groq">Groq (fast, free)</option>
        <option value="nvidia">NVIDIA NIM</option>
      </select>
      <label class="field-label" for="model">Model</label>
      <select id="model"></select>
      <label class="field-label" for="groqKey">Groq API key</label>
      <input id="groqKey" type="password" placeholder="gsk_..." autocomplete="off" />
      <label class="field-label" for="nvidiaKey">NVIDIA API key</label>
      <input id="nvidiaKey" type="password" placeholder="nvapi-..." autocomplete="off" />
      <div class="btnrow">
        <button id="save" class="mini-primary">Save</button>
        <button id="test" class="mini">Test key</button>
      </div>
      <p class="hint">Free keys: <b>console.groq.com</b> for Groq, <b>build.nvidia.com</b> for NVIDIA. Keys stay in your browser only.</p>
    </details>
  </div>
<script src="popup.js"></script>
</body>
</html>
